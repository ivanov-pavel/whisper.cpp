name: Windows x64 Static Build

on:
  push:
    branches:
      - master

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  windows-x64-static:
    runs-on: windows-latest
    
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup VC Tools
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set > "%GITHUB_ENV%"

      - name: Configure with static runtime and OpenMP
        shell: cmd
        run: |
          cmake -S . -B ./build -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=OFF

      - name: Build with static runtime and OpenMP
        shell: cmd
        run: |
          cd ./build
          msbuild ALL_BUILD.vcxproj -t:build ^
            -p:configuration=Release ^
            -p:platform=x64 ^
            -p:UseMultiToolTask=true ^
            -p:EnforceProcessCountAcrossBuilds=true ^
            -p:RuntimeLibrary=MultiThreaded ^
            -p:OpenMP=true

      - name: Check for static OpenMP
        shell: cmd
        run: |
          echo "=== Checking for static OpenMP ==="
          where libvcomp.lib
          where libomp.lib

      - name: Manually link static OpenMP if needed
        shell: cmd
        run: |
          echo "=== Manually copying static OpenMP libraries ==="
          copy "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.*\lib\x64\libvcomp.lib" build\lib\Release\ 2>nul || echo "libvcomp.lib not found"
          copy "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.*\lib\x64\libomp.lib" build\lib\Release\ 2>nul || echo "libomp.lib not found"

      - name: Check runtime library linkage
        shell: cmd
        run: |
          echo "=== Checking runtime library linkage ==="
          cd build
          for /r %%i in (*.lib) do (
            echo Checking: %%~nxi
            dumpbin /directives "%%i" | findstr "RuntimeLibrary" || echo No RuntimeLibrary directive found
            exit /b 0
          )

      - name: Check executable dependencies
        shell: cmd
        run: |
          echo "=== Checking executable dependencies ==="
          cd build
          for /r %%i in (*.exe) do (
            echo Checking: %%~nxi
            dumpbin /dependents "%%i" | findstr "MSVCR\|VCOMP"
            exit /b 0
          )

      - name: Create distribution directory structure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist\include" -Force | Out-Null
          New-Item -ItemType Directory -Path "dist\lib" -Force | Out-Null
          New-Item -ItemType Directory -Path "dist\bin" -Force | Out-Null

      - name: Copy header files
        shell: pwsh
        run: |
          echo "Copying essential header files..."
          $headers = @("whisper.h", "ggml.h", "ggml-alloc.h", "ggml-backend.h")
          foreach ($header in $headers) {
            if (Test-Path $header) {
              Copy-Item $header "dist\include\" -Force
              echo "Copied: $header"
            }
          }
          Get-ChildItem -Path "." -Filter "*.h" | ForEach-Object {
            Copy-Item $_.FullName "dist\include\" -Force
          }

      - name: Copy static libraries and executables
        shell: pwsh
        run: |
          echo "Copying libraries and executables..."
          
          $libFiles = Get-ChildItem -Path "build" -Recurse -Filter "*.lib"
          if ($libFiles) {
            foreach ($file in $libFiles) {
              echo "Copying library: $($file.Name)"
              Copy-Item $file.FullName "dist\lib\" -Force
            }
          }
          
          $exeFiles = Get-ChildItem -Path "build" -Recurse -Filter "*.exe"
          if ($exeFiles) {
            foreach ($file in $exeFiles) {
              echo "Copying executable: $($file.Name)"
              Copy-Item $file.FullName "dist\bin\" -Force
            }
          }

      - name: Copy static OpenMP libraries to distribution
        shell: pwsh
        run: |
          echo "=== Copying static OpenMP libraries ==="
          $vcompPath = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" -Recurse -Filter "libvcomp.lib" | Select-Object -First 1
          $ompPath = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" -Recurse -Filter "libomp.lib" | Select-Object -First 1
          
          if ($vcompPath) {
            Copy-Item $vcompPath.FullName "dist\lib\"
            echo "Copied libvcomp.lib"
          }
          if ($ompPath) {
            Copy-Item $ompPath.FullName "dist\lib\"
            echo "Copied libomp.lib"
          }

      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "whisper-static-x64-windows.zip" -Force

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-static-x64-windows
          path: whisper-static-x64-windows.zip
          retention-days: 30
