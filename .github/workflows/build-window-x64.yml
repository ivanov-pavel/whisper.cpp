name: Windows x64 Static Build

on:
  push:
    branches: [ master ]

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  windows-x64-static:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure and build static library (OpenMP + static runtime)
        shell: cmd
        run: |
          rem === Setup Visual Studio environment ===
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          rem === Configure static build ===
          cmake -S . -B build -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DGGML_OPENMP=ON ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DCMAKE_C_FLAGS_RELEASE="/O2 /MT /openmp:llvm" ^
            -DCMAKE_CXX_FLAGS_RELEASE="/O2 /MT /openmp:llvm"

          rem === Build all targets statically ===
          cmake --build build --config Release --parallel

      - name: Collect static libraries and headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\lib -Force | Out-Null
          New-Item -ItemType Directory -Path dist\include -Force | Out-Null

          # Copy all built static libraries
          $libFiles = Get-ChildItem -Recurse -Path "build" -Filter "*.lib"
          foreach ($lib in $libFiles) {
            Write-Host "Found library: $($lib.FullName)"
            Copy-Item $lib.FullName "dist\lib\" -Force
          }

          # Copy headers safely (skip self-overwrites)
          $headers = Get-ChildItem -Path "." -Filter "*.h" -Recurse
          foreach ($header in $headers) {
            $dest = Join-Path "dist\include" $header.Name
            if ($header.FullName -ne (Resolve-Path $dest -ErrorAction SilentlyContinue)) {
              Copy-Item $header.FullName "dist\include\" -Force
              Write-Host "Copied header: $($header.Name)"
            }
          }

          Write-Host "Static build and header collection complete."

      - name: Merge all static libraries into whisper.lib
        shell: cmd
        run: |
          rem Ensure VC tools are loaded
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          cd dist\lib

          rem Remove existing whisper.lib if exists
          if exist whisper.lib del whisper.lib

          rem Merge all .lib files into one
          lib /OUT:whisper.lib *.lib

          echo "Created single whisper.lib containing all static libraries"

      - name: Verify distribution
        shell: pwsh
        run: |
          echo "=== Distribution contents ==="
          echo "Headers:"
          Get-ChildItem -Path "dist\include" -Name
          echo "Libraries:"
          Get-ChildItem -Path "dist\lib" -Name
          echo "Total files:"
          (Get-ChildItem -Path "dist" -Recurse).Count

      - name: Create static zip package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "whisper-static-x64-windows.zip" -Force
          Write-Host "Created whisper-static-x64-windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-static-x64-windows
          path: whisper-static-x64-windows.zip
          retention-days: 30
