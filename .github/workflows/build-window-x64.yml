name: Windows x64 Static Build

on:
  push:
    branches:
      - master

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  windows-x64-static:
    runs-on: windows-latest
    
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure for static build
        shell: cmd
        run: |
          cmake -S . -B ./build -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build static libraries
        shell: cmd
        run: |
          cd ./build
          msbuild ALL_BUILD.vcxproj -t:build ^
            -p:configuration=Release ^
            -p:platform=x64 ^
            -p:UseMultiToolTask=true ^
            -p:EnforceProcessCountAcrossBuilds=true

      - name: Discover build output structure
        shell: pwsh
        run: |
          echo "=== Full build directory structure ==="
          Get-ChildItem -Path "build" -Recurse | Format-Table Name, FullName
          
          echo "=== Looking for libraries ==="
          Get-ChildItem -Path "build" -Recurse -Filter "*.lib" | Format-Table Name, Directory
          
          echo "=== Looking for executables ==="
          Get-ChildItem -Path "build" -Recurse -Filter "*.exe" | Format-Table Name, Directory
          
          echo "=== Release directories ==="
          Get-ChildItem -Path "build" -Recurse -Directory -Filter "Release" | Format-Table FullName

      - name: Create distribution directory structure
        shell: pwsh
        run: |
          mkdir -p dist\include
          mkdir -p dist\lib
          mkdir -p dist\bin

      - name: Copy header files
        shell: pwsh
        run: |
          echo "Copying header files..."
          # Copy all C/C++ headers recursively
          Get-ChildItem -Path "." -Recurse -Include "*.h", "*.hpp" | ForEach-Object {
            $relativePath = $_.FullName.Replace($pwd.Path, "").TrimStart("\")
            $destDir = Join-Path "dist\include" (Split-Path $relativePath -Parent)
            mkdir -p $destDir | Out-Null
            Copy-Item $_.FullName $destDir -Force
          }

      - name: Copy static libraries and executables
        shell: pwsh
        run: |
          echo "Copying libraries and executables..."
          
          # Find and copy all .lib files
          $libFiles = Get-ChildItem -Path "build" -Recurse -Filter "*.lib"
          if ($libFiles) {
            foreach ($file in $libFiles) {
              echo "Copying library: $($file.Name)"
              Copy-Item $file.FullName "dist\lib\" -Force
            }
          } else {
            echo "No .lib files found"
          }
          
          # Find and copy all .exe files
          $exeFiles = Get-ChildItem -Path "build" -Recurse -Filter "*.exe"
          if ($exeFiles) {
            foreach ($file in $exeFiles) {
              echo "Copying executable: $($file.Name)"
              Copy-Item $file.FullName "dist\bin\" -Force
            }
          } else {
            echo "No .exe files found"
          }

      - name: Verify distribution contents
        shell: pwsh
        run: |
          echo "=== Distribution contents ==="
          echo "Headers:"
          Get-ChildItem -Path "dist\include" -Recurse | Format-Table Name
          echo "Libraries:"
          Get-ChildItem -Path "dist\lib" -Recurse | Format-Table Name
          echo "Binaries:"
          Get-ChildItem -Path "dist\bin" -Recurse | Format-Table Name

      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "whisper-static-x64-windows.zip" -Force

      - name: Display zip contents
        shell: pwsh
        run: |
          echo "=== Zip file contents ==="
          if (Test-Path "whisper-static-x64-windows.zip") {
            7z l whisper-static-x64-windows.zip
          }

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-static-x64-windows
          path: whisper-static-x64-windows.zip
          retention-days: 30
