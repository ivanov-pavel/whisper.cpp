name: Windows x64 Static Build

on:
  push:
    branches:
      - master

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  windows-x64-static:
    runs-on: windows-latest
    
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure for static build
        shell: cmd
        run: |
          cmake -S . -B ./build -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW

      - name: Verify CMake cache
        shell: pwsh
        run: |
          echo "=== Checking CMakeCache.txt for runtime library setting ==="
          if (Test-Path "build\CMakeCache.txt") {
            Select-String -Path "build\CMakeCache.txt" -Pattern "CMAKE_MSVC_RUNTIME_LIBRARY" | ForEach-Object { $_.Line }
          }

      - name: Build static libraries
        shell: cmd
        run: |
          cd ./build
          msbuild ALL_BUILD.vcxproj -t:build ^
            -p:configuration=Release ^
            -p:platform=x64 ^
            -p:UseMultiToolTask=true ^
            -p:EnforceProcessCountAcrossBuilds=true ^
            -p:RuntimeLibrary=MultiThreaded

      - name: Check runtime library linkage
        shell: pwsh
        run: |
          echo "=== Checking runtime library linkage ==="
          $libFiles = Get-ChildItem -Path "build" -Recurse -Filter "*.lib"
          if ($libFiles) {
            foreach ($file in $libFiles[0..2]) { # Check first 3 libs
              echo "Checking: $($file.Name)"
              dumpbin /directives "$($file.FullName)" | Select-String "RuntimeLibrary"
            }
          }

      - name: Create distribution directory structure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist\include" -Force | Out-Null
          New-Item -ItemType Directory -Path "dist\lib" -Force | Out-Null
          New-Item -ItemType Directory -Path "dist\bin" -Force | Out-Null

      - name: Copy header files
        shell: pwsh
        run: |
          echo "Copying essential header files..."
          # Copy only the main headers
          $headers = @("whisper.h", "ggml.h", "ggml-alloc.h", "ggml-backend.h")
          foreach ($header in $headers) {
            if (Test-Path $header) {
              Copy-Item $header "dist\include\" -Force
              echo "Copied: $header"
            }
          }
          # Copy any other .h files in root directory
          Get-ChildItem -Path "." -Filter "*.h" | ForEach-Object {
            Copy-Item $_.FullName "dist\include\" -Force
          }

      - name: Copy static libraries and executables
        shell: pwsh
        run: |
          echo "Copying libraries and executables..."
          
          # Find and copy all .lib files
          $libFiles = Get-ChildItem -Path "build" -Recurse -Filter "*.lib"
          if ($libFiles) {
            foreach ($file in $libFiles) {
              echo "Copying library: $($file.Name)"
              Copy-Item $file.FullName "dist\lib\" -Force
            }
          } else {
            echo "No .lib files found"
          }
          
          # Find and copy all .exe files
          $exeFiles = Get-ChildItem -Path "build" -Recurse -Filter "*.exe"
          if ($exeFiles) {
            foreach ($file in $exeFiles) {
              echo "Copying executable: $($file.Name)"
              Copy-Item $file.FullName "dist\bin\" -Force
            }
          } else {
            echo "No .exe files found"
          }

      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "whisper-static-x64-windows.zip" -Force

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-static-x64-windows
          path: whisper-static-x64-windows.zip
          retention-days: 30
