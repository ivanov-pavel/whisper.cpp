name: Windows x64 Static Build

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build.yml'
      - '**/CMakeLists.txt'
      - '**/Makefile'
      - '**/*.mk'
      - '**/*.cmake'
      - '**/*.in'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  windows-x64-static:
    runs-on: windows-latest
    
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure for static build
        shell: cmd
        run: |
          cmake -S . -B ./build -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build static libraries
        shell: cmd
        run: |
          cd ./build
          msbuild ALL_BUILD.vcxproj -t:build ^
            -p:configuration=Release ^
            -p:platform=x64 ^
            -p:UseMultiToolTask=true ^
            -p:EnforceProcessCountAcrossBuilds=true

      - name: List built artifacts
        shell: pwsh
        run: |
          echo "=== Library files ==="
          dir build\lib\Release /s
          echo "=== Binary files ==="
          dir build\bin\Release /s
          echo "=== Include files ==="
          dir .\*.h /s

      - name: Create distribution directory structure
        shell: pwsh
        run: |
          mkdir -p dist\include
          mkdir -p dist\lib
          mkdir -p dist\bin

      - name: Copy header files
        shell: pwsh
        run: |
          # Copy main header files
          copy *.h dist\include\ 2>nul | Out-Null
          # Copy whisper headers
          if (Test-Path "*.hpp") {
            Copy-Item -Path "*.hpp" -Destination "dist\include\" -Recurse -Force
          }
          # Copy specific headers
          if (Test-Path "whisper.h") {
            Copy-Item -Path "whisper.h" -Destination "dist\include\"
          }
          if (Test-Path "ggml.h") {
            Copy-Item -Path "ggml.h" -Destination "dist\include\"
          }

      - name: Copy static libraries
        shell: pwsh
        run: |
          if (Test-Path "build\lib\Release\*.lib") {
            Copy-Item -Path "build\lib\Release\*.lib" -Destination "dist\lib\"
          }
          if (Test-Path "build\Release\*.lib") {
            Copy-Item -Path "build\Release\*.lib" -Destination "dist\lib\"
          }

      - name: Copy executables
        shell: pwsh
        run: |
          if (Test-Path "build\bin\Release\*.exe") {
            Copy-Item -Path "build\bin\Release\*.exe" -Destination "dist\bin\"
          }
          if (Test-Path "build\Release\*.exe") {
            Copy-Item -Path "build\Release\*.exe" -Destination "dist\bin\"
          }

      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "whisper-static-x64-windows.zip" -Force

      - name: Display zip contents
        shell: pwsh
        run: |
          echo "=== Zip file contents ==="
          if (Test-Path "whisper-static-x64-windows.zip") {
            7z l whisper-static-x64-windows.zip
          }

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-static-x64-windows
          path: whisper-static-x64-windows.zip
          retention-days: 30
